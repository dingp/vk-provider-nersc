apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-nersc
  labels:
    app: vk-nersc
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
{{ toYaml .Values.strategy | indent 4 }}
  selector:
    matchLabels:
      app: vk-nersc
  template:
    metadata:
      labels:
        app: vk-nersc
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
      - name: vk-nersc
        image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SF_API_ENDPOINT
          value: "{{ .Values.sfApiEndpoint }}"
        - name: VK_NODE_NAME
          value: "{{ .Values.vkNodeName }}"
{{- with .Values.vkNodeAddress }}
        - name: VK_NODE_IP
          value: {{ . | quote }}
{{- end }}
{{- if .Values.kubeletTLS.secretName }}
        - name: VK_TLS_CERT_FILE
          value: /etc/vk-tls/tls.crt
        - name: VK_TLS_KEY_FILE
          value: /etc/vk-tls/tls.key
        - name: VK_TLS_CLIENT_CA_FILE
          value: /etc/vk-tls/client-ca.crt
        - name: VK_TLS_CLIENT_COMMON_NAME
          value: {{ .Values.kubeletTLS.clientCommonName | quote }}
{{- end }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VK_KUBELET_LISTEN_ADDR
          value: ":{{ .Values.kubeletPort }}"
{{- with .Values.sfapiTransferLocalRoot }}
        - name: SFAPI_TRANSFER_LOCAL_ROOT
          value: "{{ . }}"
{{- end }}
{{- with .Values.extraEnv }}
{{- range . }}
        - name: {{ .name }}
          value: "{{ .value }}"
{{- end }}
{{- end }}
        ports:
        - name: kubelet
          containerPort: {{ .Values.kubeletPort }}
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: kubelet
          initialDelaySeconds: 3
          periodSeconds: 10
{{- if .Values.kubeletTLS.secretName }}
        volumeMounts:
        - name: kubelet-tls
          mountPath: /etc/vk-tls
          readOnly: true
{{- end }}
{{- with .Values.resources }}
        resources:
{{ toYaml . | indent 10 }}
{{- end }}
{{- if .Values.kubeletTLS.secretName }}
      volumes:
      - name: kubelet-tls
        secret:
          secretName: {{ .Values.kubeletTLS.secretName }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
