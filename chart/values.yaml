# Default Helm values for Virtual Kubelet NERSC provider

replicaCount: 1

image:
  repository: ghcr.io/dingp/vk-provider-nersc
  tag: latest
  pullPolicy: IfNotPresent

sfApiEndpoint: "https://api.nersc.gov/api/v1.2"

vkNodeName: "perlmutter-vk"

kubeletPort: 10250

# Provider-local root for SFAPI utilities transfer mode. Mount a shared volume
# here before using nersc.sf/transferMode=sfapi.
sfapiTransferLocalRoot: ""

serviceAccount:
  name: vk-nersc

rbac:
  create: true

resources: {}
nodeSelector:
  kubernetes.io/os: linux

tolerations: []
affinity: {}

extraEnv: []

# StatefulSet support
statefulset:
  enabled: false
  name: hpc-stateful
  replicas: 2
  account: m1234
  credentialSecretName: sfapi-client
  credentialSecretKey: sf_api.json
  transferMode: globus
  scratchBase: "/pscratch/sd/a/alice/vk-provider-nersc"
  globusCredentialSecretName: globus-client
  globusCredentialSecretKey: globus.json
  globusStagingCollectionID: nersc-collection-id
  globusScope: ""
  inputSource: "globus://source-collection-id/path/to/data"
  inputVolume: data
  outputDest: "globus://destination-collection-id/path/to/output"
  outputVolume: data
  stageOut: "true"
  nodeSelector: perlmutter-vk
  container:
    name: compute
    image: registry.example.com/compute:latest
    command: ["python"]
    args: ["compute.py"]
  volumeMounts:
    - name: data
      mountPath: /mnt/data
      readOnly: false
  volumes:
    - name: data
      claimName: hpc-data-pvc
