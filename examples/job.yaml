apiVersion: batch/v1
kind: Job
metadata:
  name: hpc-job
spec:
  template:
    metadata:
      annotations:
        nersc.slurm/account: "m1234"
        nersc.sf/credentialSecretName: "sfapi-client"
    spec:
      nodeSelector:
        kubernetes.io/hostname: perlmutter-vk
      tolerations:
      - key: virtual-kubelet.io/provider
        operator: Equal
        value: nersc
        effect: NoSchedule
      containers:
      - name: batch-task
        image: registry.example.com/batch:latest
        command: ["python"]
        args: ["process.py"]
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
      restartPolicy: Never
  backoffLimit: 0
