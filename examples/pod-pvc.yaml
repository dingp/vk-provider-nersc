apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hpc-input-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hpc-output-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-test-pod
  annotations:
    nersc.slurm/account: "m1234"
    nersc.sf/credentialSecretName: "sfapi-client"
    nersc.sf/scratchBase: "/pscratch/sd/a/alice/vk-provider-nersc"
    globus.api/inputSource: "globus://source-collection-id/path/to/input"
    nersc.sf/inputVolume: "input"
    globus.api/outputDest: "globus://destination-collection-id/path/to/output"
    nersc.sf/outputVolume: "output"
    nersc.sf/stageOut: "true"
    globus.api/credentialSecretName: "globus-client"
    globus.api/stagingCollectionID: "nersc-collection-id"
spec:
  nodeSelector:
    kubernetes.io/hostname: perlmutter-vk
  volumes:
  - name: input
    persistentVolumeClaim:
      claimName: hpc-input-pvc
  - name: output
    persistentVolumeClaim:
      claimName: hpc-output-pvc
  containers:
  - name: analysis
    image: registry.example.com/analysis:latest
    command: ["python"]
    args: ["/mnt/input/analyze.py", "--output", "/mnt/output/results.txt"]
    volumeMounts:
    - name: input
      mountPath: /mnt/input
      readOnly: true
    - name: output
      mountPath: /mnt/output
      readOnly: false
