apiVersion: v1
kind: Pod
metadata:
  name: simple-test
  annotations:
    nersc.slurm/account: "m1234"
    nersc.sf/credentialSecretName: "sfapi-client"
spec:
  nodeSelector:
    kubernetes.io/hostname: perlmutter-vk
  tolerations:
  - key: virtual-kubelet.io/provider
    operator: Equal
    value: nersc
    effect: NoSchedule
  restartPolicy: Never
  containers:
  - name: hello
    image: registry.example.com/hello:latest
    command: ["echo"]
    args: ["Hello from Perlmutter via Virtual Kubelet!"]
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
