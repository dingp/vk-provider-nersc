apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hpc-stateful
spec:
  serviceName: "hpc-stateful"
  replicas: 2
  selector:
    matchLabels:
      app: hpc-stateful
  template:
    metadata:
      labels:
        app: hpc-stateful
      annotations:
        nersc.slurm/account: "m1234"
        nersc.sf/credentialSecretName: "sfapi-client"
        nersc.sf/scratchBase: "/pscratch/sd/a/alice/vk-provider-nersc"
        globus.api/inputSource: "globus://source-collection-id/path/to/data"
        nersc.sf/inputVolume: "data"
        globus.api/credentialSecretName: "globus-client"
        globus.api/stagingCollectionID: "nersc-collection-id"
    spec:
      nodeSelector:
        kubernetes.io/hostname: perlmutter-vk
      containers:
      - name: compute
        image: registry.example.com/compute:latest
        command: ["python"]
        args: ["compute.py"]
        volumeMounts:
        - name: data
          mountPath: /mnt/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hpc-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hpc-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
